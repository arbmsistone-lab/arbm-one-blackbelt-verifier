name: ARBM ONE Black Belt Public Verifier

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "verify"
        type: choice
        options:
          - verify
          - dr-restore
          - dr-audience-probe
  push:
    branches: [main]
    paths:
      - snapshot.enc
      - manifest.json
      - verify-snapshot.mjs
      - .github/workflows/verify.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: arbm-one-blackbelt-public-verifier
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Decrypt exact-SHA snapshot
        env:
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
        run: node verify-snapshot.mjs

      - name: Verify embedded Git source SHA
        shell: bash
        run: |
          set -euo pipefail
          embedded="$(git get-tar-commit-id < snapshot.tar)"
          expected="$(node -p "require('./manifest.json').source_sha")"
          test "$embedded" = "$expected"
          echo "EMBEDDED_SOURCE_SHA=$embedded"

      - name: Extract exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          tar -xf snapshot.tar -C source

      - name: Run independent provider gate
        working-directory: source
        env:
          ARBM_CI_PROVIDER: github-public-verifier
          ARBM_CI_SCOPE: provider
        run: npm run ci:portable:core

      - name: Prepare canonical Git identity for packaging
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(node -p "require('../manifest.json').source_sha")"
          test "$source_sha" = "$ARBM_VERIFIED_SOURCE_SHA"
          git init -q
          git config user.name "ARBM Blackbelt Verifier"
          git config user.email "arbm-blackbelt@users.noreply.github.com"
          git add -A
          git commit -q -m "verified snapshot packaging workspace"
          workspace_commit="$(git rev-parse HEAD)"
          git update-ref "refs/replace/$source_sha" "$workspace_commit"
          git update-ref HEAD "$source_sha"
          test "$(git rev-parse HEAD)" = "$source_sha"
          git archive --format=tar HEAD -o /tmp/blackbelt-canonical-probe.tar
          test "$(git get-tar-commit-id < /tmp/blackbelt-canonical-probe.tar)" = "$source_sha"
      - name: Run commercial fresh-install proof
        working-directory: source
        shell: bash
        run: |
          export ARBM_VERIFIED_SOURCE_SHA="$(node -p "require('../manifest.json').source_sha")"
          npm run commercial:certify | tee commercial-fresh-install-evidence.log

      - name: Attest GitHub public verifier with OIDC
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(node -p "require('./manifest.json').source_sha")"
          contract="$(node -p "require('./manifest.json').gate_contract_version")"
          oidc_json="$(curl --fail-with-body --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=arbm-platform-ci")"
          oidc="$(printf '%s' "$oidc_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          body="$(node -e 'const m=require("./manifest.json"); process.stdout.write(JSON.stringify({provider:"github",sha:m.source_sha,status:"success",gate_contract_version:m.gate_contract_version,build_ref:process.env.GITHUB_RUN_ID}))')"
          http="$(curl --silent --show-error -o attest-response.json -w '%{http_code}'             -X POST 'https://pvkpkqwdnnpkgvllwqbc.supabase.co/functions/v1/arbm-platform-api-v1/v1/ci-attest'             -H "Authorization: Bearer $oidc"             -H 'Content-Type: application/json'             -d "$body")"
          if [ "$http" = "200" ]; then
            echo "GITHUB_PUBLIC_ATTEST=PASS source_sha=$source_sha contract=$contract"
          elif [ "$http" = "409" ] && grep -q 'DUPLICATE_EVIDENCE_REJECTED' attest-response.json; then
            echo "GITHUB_PUBLIC_ATTEST=PASS duplicate"
          else
            echo "GITHUB_PUBLIC_ATTEST=FAIL http=$http" >&2
            cat attest-response.json >&2 || true
            exit 1
          fi

      - name: Emit proof manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("fs");
          const m=require("./manifest.json");
          fs.writeFileSync("proof.json", JSON.stringify({
            status:"PASS",
            provider:"github-public-verifier",
            source_repo:m.source_repo,
            source_sha:m.source_sha,
            archive_sha256:m.archive_sha256,
            gate_contract_version:m.gate_contract_version,
            run_id:process.env.GITHUB_RUN_ID,
            workflow_ref:process.env.GITHUB_WORKFLOW_REF
          }, null, 2)+"\n");
          NODE

      - name: Upload proof artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arbm-one-blackbelt-proof-${{ github.run_id }}
          path: proof.json
          retention-days: 30

  dr-restore:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dr-restore' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -Eq ' 17\.'
          /usr/lib/postgresql/17/bin/pg_restore --version | grep -Eq ' 17\.'
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Restore application schemas into Neon DR
        shell: bash
        run: |
          set -euo pipefail
          SRC_API='https://pvkpkqwdnnpkgvllwqbc.supabase.co/functions/v1/arbm-platform-api-v1/v1'
          DST_API='https://ep-twilight-resonance-acg7v2h2.apirest.sa-east-1.aws.neon.tech/arbm_one_dr/rest/v1'
          SRC_LEASE=''
          DST_ROLE=''
          SRC_DB_URL=''
          DST_DB_URL=''

          mint_oidc() {
            local audience="$1"
            local enc
            enc="$(node -p "encodeURIComponent(process.argv[1])" "$audience")"
            curl -fsS               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$enc" |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(1);process.stdout.write(j.value)})'
          }

          cleanup() {
            set +e
            if [ -n "$SRC_LEASE" ]; then
              tok="$(mint_oidc 'arbm-platform-ci' 2>/dev/null || true)"
              if [ -n "$tok" ]; then
                body="$(node -e 'process.stdout.write(JSON.stringify({lease_id:process.argv[1]}))' "$SRC_LEASE")"
                curl -sS -X POST "$SRC_API/ci-backup-db-lease-revoke"                   -H "Authorization: Bearer $tok"                   -H 'Content-Type: application/json'                   -d "$body" >/dev/null || true
              fi
            fi

            if [ -n "$DST_ROLE" ]; then
              aborted="false"
              if [ -n "$DST_DB_URL" ]; then
                abort_json="$(psql "$DST_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select dr_control.abort_restore_lease_db()::text" 2>/dev/null || true)"
                if [ -n "$abort_json" ]; then
                  aborted="$(printf '%s' "$abort_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(String(j.ok===true&&j.aborted===true&&j.revoked===true&&j.login_disabled===true))}catch{process.stdout.write("false")}})' 2>/dev/null || true)"
                fi
              fi

              if [ "$aborted" != "true" ]; then
                tok="$(mint_oidc "${DST_AUD:-arbm-platform-ci}" 2>/dev/null || true)"
                if [ -n "$tok" ]; then
                  body="$(node -e 'process.stdout.write(JSON.stringify({p_role:process.argv[1]}))' "$DST_ROLE")"
                  curl -sS -X POST "$DST_API/rpc/revoke_restore_lease"                     -H "Authorization: Bearer $tok"                     -H 'Content-Type: application/json'                     -d "$body" >/dev/null || true
                fi
              fi
            fi
          }
          trap cleanup EXIT

          src_oidc="$(mint_oidc 'arbm-platform-ci')"
          src_http="$(curl -sS -o src-lease-response.json -w '%{http_code}' -X POST "$SRC_API/ci-backup-db-lease" -H "Authorization: Bearer $src_oidc")"
          echo "SOURCE_LEASE_HTTP=$src_http"
          if [ "$src_http" != "200" ]; then
            node -e 'const fs=require("fs");let j={};try{j=JSON.parse(fs.readFileSync("src-lease-response.json","utf8"))}catch{}; console.error("SOURCE_LEASE_ERROR="+String(j.error||j.code||"UNKNOWN").slice(0,120)); process.exit(1)'
          fi
          src_resp="$(cat src-lease-response.json)"
          SRC_LEASE="$(printf '%s' "$src_resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).lease_id||""))')"
          SRC_DB_URL="$(printf '%s' "$src_resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).db_url||""))')"
          test -n "$SRC_LEASE" && test -n "$SRC_DB_URL"
          echo "::add-mask::$SRC_DB_URL"

          reset_oidc="$(mint_oidc 'arbm-one-dr-neon')"
          reset_http="$(curl -sS -o dst-reset-response.json -w '%{http_code}' -X POST "$DST_API/rpc/reset_restore_target"             -H "Authorization: Bearer $reset_oidc"             -H 'Content-Type: application/json'             -d '{}')"
          echo "TARGET_RESET_HTTP=$reset_http"
          test "$reset_http" = "200"
          reset_ok="$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("dst-reset-response.json","utf8"));process.stdout.write(String(j.ok===true&&j.reset===true&&Number(j.active_leases)===0))')"
          echo "TARGET_RESET_DB=$reset_ok"
          test "$reset_ok" = "true"

          DST_PASSWORD="$(openssl rand -hex 40)"
          echo "::add-mask::$DST_PASSWORD"
          DST_AUD=''
          dst_http=''
          dst_body="$(node -e 'process.stdout.write(JSON.stringify({p_password:process.argv[1],p_run_id:process.argv[2]}))' "$DST_PASSWORD" "$GITHUB_RUN_ID")"
          for attempt in $(seq 1 8); do
            for aud in 'arbm-platform-ci' 'arbm-one-dr-neon'; do
              candidate_oidc="$(mint_oidc "$aud")"
              candidate_http="$(curl -sS -o dst-lease-response.json -w '%{http_code}' -X POST "$DST_API/rpc/issue_restore_lease"             -H "Authorization: Bearer $candidate_oidc"             -H 'Content-Type: application/json'             -d "$dst_body")"
              if [ "$candidate_http" = "200" ]; then
                DST_AUD="$aud"
                dst_oidc="$candidate_oidc"
                dst_http="$candidate_http"
                break 2
              fi
            done
            sleep 2
          done
          test -n "$DST_AUD"
          test "$dst_http" = "200"
          echo "TARGET_OIDC_AUDIENCE=$DST_AUD"
          echo "TARGET_LEASE_HTTP=$dst_http"
          dst_resp="$(cat dst-lease-response.json)"
          dst_ok="$(printf '%s' "$dst_resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).ok===true)))')"
          if [ "$dst_ok" != "true" ]; then
            printf '%s' "$dst_resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s); console.error("TARGET_LEASE_STAGE="+String(j.stage||"UNKNOWN")); console.error("TARGET_LEASE_SQLSTATE="+String(j.sqlstate||"UNKNOWN")); console.error("TARGET_LEASE_ERROR="+String(j.error||"UNKNOWN").slice(0,120)); process.exit(1)})'
          fi
          DST_ROLE="$(printf '%s' "$dst_resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).role||""))')"
          DST_HOST="$(printf '%s' "$dst_resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).host||""))')"
          DST_PORT="$(printf '%s' "$dst_resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).port||5432)))')"
          DST_DB="$(printf '%s' "$dst_resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).database||""))')"
          test -n "$DST_ROLE" && test -n "$DST_HOST" && test -n "$DST_DB"
          DST_DB_URL="postgresql://${DST_ROLE}:${DST_PASSWORD}@${DST_HOST}:${DST_PORT}/${DST_DB}?sslmode=require"
          echo "::add-mask::$DST_DB_URL"

          SCHEMAS=(
            public
            app_private
            arbm_backup_p0_20260704
            arbm_backup_private
            arbm_internal
            arbm_mesh_private
            arbm_sist_top3
          )
          DUMP_ARGS=()
          for s in "${SCHEMAS[@]}"; do DUMP_ARGS+=(--schema="$s"); done

          pg_dump "$SRC_DB_URL"             --format=custom             --no-owner             --no-privileges             "${DUMP_ARGS[@]}"             --file=arbm-one-dr.dump

          src_counts="$(psql "$SRC_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p'))||'|'||(select count(*) from pg_policies where schemaname='public')||'|'||(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname not in ('arbm_auth_uid','arbm_auth_role','arbm_auth_jwt','arbm_request_jwt'))||'|'||(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.prosecdef)")"

          pg_restore --list arbm-one-dr.dump > restore.list
          grep -vE 'auth_password_vetting_auth_user_id_fkey|commercial_bootstrap_state_v1_consumed_by_fkey|core_modulos_eventos_v1_criado_por_fkey|core_modulos_v1_atualizado_por_fkey|usuarios_auth_user_id_fkey' restore.list > restore.filtered.list

          pg_restore --section=pre-data --use-list=restore.filtered.list --no-owner --no-privileges --file=pre.sql arbm-one-dr.dump
          pg_restore --section=post-data --use-list=restore.filtered.list --no-owner --no-privileges --file=post.sql arbm-one-dr.dump

          for f in pre.sql post.sql; do
            perl -0pi -e 's/auth\.uid\(\)/public.arbm_auth_uid()/g; s/auth\.jwt\(\)/public.arbm_auth_jwt()/g; s/auth\.role\(\)/public.arbm_auth_role()/g; s/auth\.users/public.arbm_auth_users_compat/g' "$f"
          done
          sed -i -E '/^[[:space:]]*CREATE[[:space:]]+SCHEMA[[:space:]]+public;[[:space:]]*$/d; /^[[:space:]]*COMMENT[[:space:]]+ON[[:space:]]+SCHEMA[[:space:]]+public[[:space:]]+IS[[:space:]]+/d' pre.sql

          if ! psql "$DST_DB_URL" -X -v ON_ERROR_STOP=1 -f pre.sql 2>pre.err; then
            cat pre.err
            line="$(sed -n 's/.*pre.sql:\([0-9][0-9]*\):.*/\1/p' pre.err | head -n1)"
            if [ -n "$line" ]; then
              start=$((line>12 ? line-12 : 1))
              end=$((line+12))
              nl -ba pre.sql | sed -n "${start},${end}p"
            fi
            exit 1
          fi

          pg_restore --section=data --use-list=restore.filtered.list --no-owner --no-privileges --dbname="$DST_DB_URL" arbm-one-dr.dump
          psql "$DST_DB_URL" -X -v ON_ERROR_STOP=1 -f post.sql

          dst_counts="$(psql "$DST_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p'))||'|'||(select count(*) from pg_policies where schemaname='public')||'|'||(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname not in ('arbm_auth_uid','arbm_auth_role','arbm_auth_jwt','arbm_request_jwt'))||'|'||(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.prosecdef)")"

          echo "SOURCE_COUNTS=$src_counts"
          echo "TARGET_COUNTS=$dst_counts"
          test "$src_counts" = "$dst_counts"

          PROMOTED_ROLE="$DST_ROLE"
          promote_json="$(psql "$DST_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select dr_control.promote_restore_lease_db()::text")"
          promote_ok="$(printf '%s' "$promote_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(String(j.ok===true&&j.promoted===true&&j.revoked===true&&j.login_disabled===true))})')"
          echo "TARGET_PROMOTE_DB=$promote_ok"
          test "$promote_ok" = "true"

          finalize_ok="false"
          finalize_http=""
          for attempt in $(seq 1 8); do
            finalize_oidc="$(mint_oidc 'arbm-one-dr-neon')"
            finalize_body="$(node -e 'process.stdout.write(JSON.stringify({p_role:process.argv[1]}))' "$PROMOTED_ROLE")"
            finalize_http="$(curl -sS -o dst-finalize-response.json -w '%{http_code}' -X POST "$DST_API/rpc/finalize_restore_role"               -H "Authorization: Bearer $finalize_oidc"               -H 'Content-Type: application/json'               -d "$finalize_body")"
            echo "TARGET_FINALIZE_ATTEMPT=$attempt HTTP=$finalize_http"
            if [ "$finalize_http" = "200" ]; then
              finalize_ok="$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("dst-finalize-response.json","utf8"));process.stdout.write(String(j.ok===true&&j.finalized===true&&Number(j.owned_objects)===0&&Number(j.active_sessions)===0))')"
              if [ "$finalize_ok" = "true" ]; then
                break
              fi
            fi
            if [ "$attempt" -lt 8 ]; then sleep $((attempt*2)); fi
          done
          echo "TARGET_FINALIZE_DB=$finalize_ok"
          test "$finalize_http" = "200"
          test "$finalize_ok" = "true"
          DST_ROLE=''

          sha256sum arbm-one-dr.dump pre.sql post.sql > dr-restore.sha256
          printf '%s\n'             "status=PASS"             "run_id=$GITHUB_RUN_ID"             "source_counts=$src_counts"             "target_counts=$dst_counts"             "source_lease=$SRC_LEASE"             "target_role=$PROMOTED_ROLE"             > dr-restore.env

      - name: Upload DR restore proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arbm-one-dr-restore-${{ github.run_id }}
          path: |
            dr-restore.env
            dr-restore.sha256
          retention-days: 90
          if-no-files-found: error



  dr-audience-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dr-audience-probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover current Neon audience
        shell: bash
        run: |
          set -euo pipefail
          api='https://ep-twilight-resonance-acg7v2h2.apirest.sa-east-1.aws.neon.tech/arbm_one_dr/rest/v1/rpc/verifier_probe'
          candidates=(
            'github-verifier-dr'
            'arbm-platform-ci'
            'arbm-one-dr-neon'
            'arbm_one_dr'
            'round-night-66000259'
            'https://github.com/arbmsistone-lab/arbm-one-blackbelt-verifier'
            'https://ep-twilight-resonance-acg7v2h2.apirest.sa-east-1.aws.neon.tech/arbm_one_dr/rest/v1'
          )
          : > audience-results.txt
          success=''
          for aud in "${candidates[@]}"; do
            enc="$(node -p "encodeURIComponent(process.argv[1])" "$aud")"
            oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$enc")"
            oidc="$(printf '%s' "$oidc_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value||""))')"
            code="$(curl -sS -o body.json -w '%{http_code}' -X POST "$api" -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' -d '{}')"
            msg="$(node -e 'const fs=require("fs");let j={};try{j=JSON.parse(fs.readFileSync("body.json","utf8"))}catch{};process.stdout.write(String(j.message||j.error||j.code||j.ok||"").slice(0,160))')"
            printf '%s\t%s\t%s\n' "$code" "$aud" "$msg" >> audience-results.txt
            if [ "$code" = "200" ]; then success="$aud"; break; fi
          done
          cat audience-results.txt
          test -n "$success"
          printf '%s' "$success" > audience-success.txt
      - name: Upload audience proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neon-audience-proof-${{ github.run_id }}
          path: |
            audience-results.txt
            audience-success.txt
          retention-days: 7
          if-no-files-found: warn
