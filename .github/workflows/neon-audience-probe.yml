name: Neon Audience Probe
on:
  push:
    branches: [dr/neon-audience-probe-20260918]
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Neon audiences
        shell: bash
        run: |
          set -euo pipefail
          api='https://ep-twilight-resonance-acg7v2h2.apirest.sa-east-1.aws.neon.tech/arbm_one_dr/rest/v1/rpc/verifier_probe'
          candidates=('arbm-platform-ci' 'arbm-one-dr-neon' 'https://github.com/arbmsistone-lab' 'https://github.com/arbmsistone-lab/arbm-one-blackbelt-verifier' 'github-verifier-dr' 'arbm_one_dr' 'round-night-66000259')
          : > audience-results.txt
          success=''
          for aud in "${candidates[@]}"; do
            enc="$(node -p "encodeURIComponent(process.argv[1])" "$aud")"
            oidc_json="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$enc")"
            oidc="$(printf '%s' "$oidc_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value||""))')"
            code="$(curl -sS -o body.json -w '%{http_code}' -X POST "$api" -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' -d '{}')"
            msg="$(node -e 'const fs=require("fs");let j={};try{j=JSON.parse(fs.readFileSync("body.json","utf8"))}catch{};process.stdout.write(String(j.message||j.code||j.ok||"").slice(0,120))')"
            printf '%s\t%s\t%s\n' "$code" "$aud" "$msg" >> audience-results.txt
            if [ "$code" = "200" ]; then success="$aud"; break; fi
          done
          cat audience-results.txt
          test -n "$success"
          printf '%s' "$success" > audience-success.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neon-audience-proof-${{ github.run_id }}
          path: |
            audience-results.txt
            audience-success.txt
          retention-days: 7
