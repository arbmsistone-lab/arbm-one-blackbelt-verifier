name: Blackbelt Recipient Public Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Emit recipient public key
        env:
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
        run: node derive-recipient.mjs
