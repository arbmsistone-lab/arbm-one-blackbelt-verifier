name: CircleCI 6148 Rerun
on:
  push:
    branches: [chore/circleci-6148-rca]
permissions:
  contents: read
jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed CircleCI workflow
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CIRCLECI_TOKEN"
          wid="4a48bb64-4642-4bdc-a940-1989b1549598"
          code="$(curl -sS -o rerun.json -w '%{http_code}'             -X POST             -H "Circle-Token: $CIRCLECI_TOKEN"             -H "Content-Type: application/json"             -d '{"from_failed":true}'             "https://circleci.com/api/v2/workflow/$wid/rerun")"
          echo "RERUN_HTTP=$code"
          test "$code" = "202"
          python3 - <<'PY'
          import json
          j=json.load(open("rerun.json"))
          print("RERUN_WORKFLOW_ID="+str(j.get("workflow_id")))
          print("RERUN_MESSAGE="+str(j.get("message")))
          PY
