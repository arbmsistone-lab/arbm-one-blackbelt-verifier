name: CircleCI Infra RCA
on:
  push:
    branches: [chore/circleci-6148-rca]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect CircleCI pipeline errors
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
        run: |
          set -euo pipefail
          H="Circle-Token: $CIRCLECI_TOKEN"
          pid="c1452464-aaea-4bbf-8008-404beaeca9a2"
          curl -fsS -H "$H" "https://circleci.com/api/v2/pipeline/$pid" -o pipeline.json
          curl -fsS -H "$H" "https://circleci.com/api/v1.1/project/github/arbmsistone-lab/ARBM-one/6151" -o build.json
          python3 - <<'PY'
          import json
          p=json.load(open("pipeline.json"))
          b=json.load(open("build.json"))
          print("PIPELINE_STATE="+str(p.get("state")))
          print("PIPELINE_NUMBER="+str(p.get("number")))
          print("PIPELINE_VCS_REVISION="+str((p.get("vcs") or {}).get("revision")))
          print("PIPELINE_ERRORS="+str(p.get("errors")))
          for k in ("status","outcome","failed","infrastructure_fail","why","fail_reason","queued_at","start_time","stop_time","usage_queued_at","build_time_millis","lifecycle"):
              print("BUILD_"+k.upper()+"="+str(b.get(k)))
          msgs=b.get("messages") or []
          for i,m in enumerate(msgs[:20],1):
              if isinstance(m,dict):
                  print("MESSAGE_%d_TYPE=%s"%(i,str(m.get("type"))))
                  print("MESSAGE_%d_MESSAGE=%s"%(i,str(m.get("message"))[:2000]))
              else:
                  print("MESSAGE_%d=%s"%(i,str(m)[:2000]))
          PY
